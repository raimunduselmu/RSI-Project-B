# Reset password akun demo di database cloud setiap malam (02.00 WIB),
# supaya pengunjung portofolio yang mengganti password tidak mengunci akun demo.
name: Reset akun demo

on:
  schedule:
    - cron: '0 19 * * *'   # 19.00 UTC = 02.00 WIB
  workflow_dispatch:        # bisa dijalankan manual dari tab Actions

jobs:
  reset:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx tsx src/db/scripts/reset-demo-passwords.ts --demo-only
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: '1433'
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_ENCRYPT: 'true'
          DB_TRUST_CERT: 'true'
          JWT_SECRET: placeholder-tidak-dipakai-di-script-ini
          SEED_DEMO_PASSWORD: Demo-12345
