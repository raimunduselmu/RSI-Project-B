      security: [{ cookieAuth: [] }]
      parameters: [{ name: q, in: query, schema: { type: string } }]
      responses: { '200': { description: '{ months[], officers[{ cells: { YYYY-MM: status } }], totals }' } }
  /kas/payments/{id}:
    get:
      tags: [Iuran Kas]
      summary: Detail pengajuan (pemilik, Bendahara, PHT, Admin)
      security: [{ cookieAuth: [] }]
