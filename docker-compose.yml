# Opsi A — deployment utama di VM Ubuntu Server 22.04 (TSD 1.2)
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: kmk-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    container_name: kmk-backend
    env_file: .env
    environment:
      DB_HOST: db
      NODE_ENV: production
      UPLOAD_DIR: /var/kmk/uploads
    volumes:
      - uploads:/var/kmk/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
    container_name: kmk-web
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mssql-data:
  uploads:
